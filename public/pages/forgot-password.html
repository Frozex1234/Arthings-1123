<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Відновлення пароля Arthings">
    <title>Відновлення пароля - Arthings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="icon" type="image/png" href="/assets/images/logo.png">
</head>

<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="logo">
                    <img src="/assets/images/logo.png" alt="Arthings" width="56" height="56">
                </a>
                <h1>Відновлення пароля</h1>
                <p>Введіть пошту — ми надішлемо посилання для зміни пароля</p>
            </div>

            <form id="forgot-form" class="auth-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                    Надіслати посилання
                </button>
            </form>

            <div id="sent-message" class="hidden" style="text-align:center;padding:1rem 0;color:#374151;">
                <div style="font-size:2.5rem;margin-bottom:0.5rem;">📬</div>
                <p style="margin:0;">
                    Якщо для цієї адреси існує акаунт, ми надіслали лист із посиланням.
                    Перевірте вхідні та теку зі спамом.
                </p>
            </div>

            <div class="auth-footer">
                <a href="/pages/login.html">Повернутися до входу</a>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('forgot-form');
            const emailInput = document.getElementById('email');

            emailInput.addEventListener('input', () => clearFormError(emailInput));

            form.addEventListener('submit', async event => {
                event.preventDefault();

                const email = emailInput.value.trim();
                if (!validateEmail(email)) {
                    showFormError(emailInput, 'Введіть коректну адресу');
                    return;
                }

                const button = form.querySelector('button[type="submit"]');
                button.disabled = true;
                button.textContent = 'Надсилаємо…';

                try {
                    await api.post('/api/auth/forgot-password', { email });

                    // The response is deliberately identical whether or not the
                    // account exists, so the UI must not imply otherwise.
                    form.classList.add('hidden');
                    document.getElementById('sent-message').classList.remove('hidden');
                } catch (error) {
                    showToast('error', error.message);
                    button.disabled = false;
                    button.textContent = 'Надіслати посилання';
                }
            });
        });
    </script>
</body>

</html>
