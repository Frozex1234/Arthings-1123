<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Встановіть новий пароль Arthings">
    <title>Новий пароль - Arthings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="icon" type="image/png" href="/assets/images/logo.png">
    <style>
        .strength-bar {
            height: 4px;
            border-radius: 999px;
            background: #e5e7eb;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .strength-fill {
            height: 100%;
            width: 0;
            border-radius: 999px;
            transition: width .2s, background-color .2s;
        }

        .strength-text {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 0.35rem;
        }
    </style>
</head>

<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="logo">
                    <img src="/assets/images/logo.png" alt="Arthings" width="56" height="56">
                </a>
                <h1>Новий пароль</h1>
                <p id="subtitle">Перевіряємо посилання…</p>
            </div>

            <form id="reset-form" class="auth-form hidden">
                <div class="form-group">
                    <label class="form-label" for="password">Новий пароль</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••"
                        autocomplete="new-password" required>
                    <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
                    <div class="strength-text" id="strength-text">Мінімум 8 символів</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm">Повторіть пароль</label>
                    <input type="password" id="confirm" class="form-input" placeholder="••••••••"
                        autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                    Зберегти пароль
                </button>
            </form>

            <div id="invalid-message" class="hidden" style="text-align:center;padding:1rem 0;color:#374151;">
                <div style="font-size:2.5rem;margin-bottom:0.5rem;">⚠️</div>
                <p style="margin:0 0 1rem;">
                    Це посилання недійсне або вже використане.
                    Посилання діють обмежений час і лише один раз.
                </p>
                <a href="/pages/forgot-password.html" class="btn btn-primary">Надіслати нове</a>
            </div>

            <div class="auth-footer">
                <a href="/pages/login.html">Повернутися до входу</a>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = getUrlParam('token');
            const form = document.getElementById('reset-form');
            const invalid = document.getElementById('invalid-message');
            const subtitle = document.getElementById('subtitle');
            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirm');

            function showInvalid() {
                subtitle.textContent = 'Посилання недійсне';
                form.classList.add('hidden');
                invalid.classList.remove('hidden');
            }

            if (!token) {
                showInvalid();
                return;
            }

            // Check the token before showing the form, so an expired link does
            // not let someone type a password only to be rejected afterwards.
            try {
                const result = await api.get(
                    `/api/auth/reset-password/validate?token=${encodeURIComponent(token)}`
                );
                if (!result.valid) {
                    showInvalid();
                    return;
                }
            } catch {
                showInvalid();
                return;
            }

            subtitle.textContent = 'Придумайте новий пароль для свого акаунта';
            form.classList.remove('hidden');
            passwordInput.focus();

            /** Rough strength signal — length dominates, variety helps. */
            function scorePassword(value) {
                let score = 0;
                if (value.length >= 8) score += 1;
                if (value.length >= 12) score += 1;
                if (/[a-z]/.test(value) && /[A-Z]/.test(value)) score += 1;
                if (/\d/.test(value)) score += 1;
                if (/[^A-Za-z0-9]/.test(value)) score += 1;
                return Math.min(score, 4);
            }

            passwordInput.addEventListener('input', () => {
                clearFormError(passwordInput);

                const levels = [
                    { width: '15%', color: '#ef4444', label: 'Дуже слабкий' },
                    { width: '35%', color: '#f59e0b', label: 'Слабкий' },
                    { width: '60%', color: '#eab308', label: 'Прийнятний' },
                    { width: '80%', color: '#22c55e', label: 'Хороший' },
                    { width: '100%', color: '#16a34a', label: 'Надійний' }
                ];

                const level = levels[scorePassword(passwordInput.value)];
                const fill = document.getElementById('strength-fill');
                fill.style.width = passwordInput.value ? level.width : '0';
                fill.style.backgroundColor = level.color;
                document.getElementById('strength-text').textContent =
                    passwordInput.value ? level.label : 'Мінімум 8 символів';
            });

            confirmInput.addEventListener('input', () => clearFormError(confirmInput));

            form.addEventListener('submit', async event => {
                event.preventDefault();

                const password = passwordInput.value;

                if (password.length < 8) {
                    showFormError(passwordInput, 'Пароль має містити щонайменше 8 символів');
                    return;
                }
                if (password !== confirmInput.value) {
                    showFormError(confirmInput, 'Паролі не збігаються');
                    return;
                }

                const button = form.querySelector('button[type="submit"]');
                button.disabled = true;
                button.textContent = 'Зберігаємо…';

                try {
                    await api.post('/api/auth/reset-password', { token, password });
                    showToast('success', 'Пароль змінено');
                    setTimeout(() => { window.location.href = '/pages/login.html'; }, 800);
                } catch (error) {
                    if (error.code === 'INVALID_TOKEN') {
                        showInvalid();
                        return;
                    }
                    showToast('error', error.message);
                    button.disabled = false;
                    button.textContent = 'Зберегти пароль';
                }
            });
        });
    </script>
</body>

</html>
